name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, pruebas y build web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Instalar dependencias compartidas y Android
        run: npm ci
      - name: Instalar dependencias web
        run: npm ci --prefix web
      - name: TypeScript compartido y Android
        run: npm run typecheck
      - name: Pruebas compartidas
        run: npm test
      - name: TypeScript y build web
        run: npm run web:build
      - name: Pruebas web
        run: npm run web:test
